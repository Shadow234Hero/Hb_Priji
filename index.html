<!doctype html><html><head><meta charset=utf8><link rel="icon" href="favicon.ico"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Be-Intehaan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Jost:ital,wght@0,300..700;1,300..700&display=swap">
<style>
/* Layout: a velvet-red desk. Lamp and flowers float at the edges, polaroid keepsakes sit in a left column, the active chapter is centred on the right, a ticket-style tab bar runs across the top. */
:root{
  --velvet:#3a0a13; --velvet-2:#551220; --gold:#d2a462; --gold-2:#e9c88b; --cream:#f3e6d2; --paper:#efdfc6; --blush:#d6a597; --ink:#3b0d16; --pink:#f2b8c6;
  --serif:"Bodoni Moda",Georgia,serif; --sans:Jost,ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--velvet);color:var(--cream);font-family:var(--sans);text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif)}
button{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px}
img{max-width:100%}

.desk{--px:0;--py:0;position:relative;min-height:100vh;overflow:hidden;color:var(--cream);background:var(--velvet)}
.velvet{position:fixed;inset:0;z-index:0;background:
  radial-gradient(ellipse 60% 50% at 50% 40%,rgba(120,24,40,.55),transparent 70%),
  radial-gradient(ellipse at 10% 5%,rgba(255,190,110,.18),transparent 35%),
  repeating-radial-gradient(circle at 30% 30%,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),
  linear-gradient(160deg,#551220,#380912 55%,#2a060e)}
.layer{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.lamp{position:absolute;top:-40px;left:-50px;width:210px;z-index:1;transform:translate(calc(var(--px)*-10px),calc(var(--py)*-8px));filter:drop-shadow(0 20px 30px rgba(0,0,0,.5))}
.lamp img,.flowers img{width:100%;height:auto;display:block;border-radius:50%;-webkit-mask-image:radial-gradient(circle,#000 55%,transparent 72%);mask-image:radial-gradient(circle,#000 55%,transparent 72%)}
.flowers{position:absolute;top:150px;right:-20px;width:110px;z-index:1;transform:translate(calc(var(--px)*-14px),calc(var(--py)*-10px))}
.flowers img{border-radius:0;-webkit-mask-image:radial-gradient(ellipse,#000 45%,transparent 70%);mask-image:radial-gradient(ellipse,#000 45%,transparent 70%)}
.spark{position:absolute;color:var(--gold);z-index:1;animation:twinkle 3.2s ease-in-out infinite}
.s1{top:285px;right:70px}.s2{top:590px;right:150px;animation-delay:1s}.s3{top:620px;right:100px;transform:scale(.6);animation-delay:2s}
@keyframes twinkle{50%{opacity:.35;transform:scale(.8)}}

/* top bar */
.topbar{position:relative;z-index:5;display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:18px;margin:20px 16px 0 220px;border-top:1px dashed rgba(210,164,98,.45);border-bottom:1px dashed rgba(210,164,98,.45)}
.tabs{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;border:1px solid rgba(210,164,98,.5);border-radius:4px 28px 28px 4px;background:rgba(40,6,12,.55);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),0 6px 18px rgba(0,0,0,.35)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:8px;padding:0 22px;height:46px;border:0;border-right:1px dashed rgba(210,164,98,.35);background:transparent;color:var(--cream);font-family:var(--serif);font-size:17px;cursor:pointer}
.tab .lk{color:var(--gold);display:inline-flex}
.tab.done{background:linear-gradient(180deg,#a06a2c,#7d4c1c)}
.tab.active{background:linear-gradient(180deg,#ecd6b8,#d9bf9b);color:var(--ink)}
.tab:disabled{cursor:not-allowed;opacity:.85}
.tab:not(:disabled):not(.active):hover{background:rgba(210,164,98,.15)}
.count{flex:none;align-self:center;padding:0 26px 0 18px;font-size:14px;letter-spacing:.03em;white-space:nowrap}
.dates{border-left:1px solid rgba(210,164,98,.5);padding:4px 22px;font-family:var(--serif);font-size:13px;line-height:1.7}
.dates p{margin:0;white-space:nowrap}
.dates b{font-weight:500;color:var(--gold-2)}
.dot{color:var(--gold);margin:0 4px}
.music{display:flex;align-items:center;gap:10px;color:var(--gold);border-left:1px solid rgba(210,164,98,.5);padding-left:18px}
.brand img{width:28px;height:28px;border-radius:50%;display:block}
.switch{width:42px;height:22px;border-radius:99px;border:1px solid rgba(255,255,255,.2);background:#5b4a4c;position:relative;cursor:pointer;padding:0}
.switch span{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#a99a9b;transition:transform .25s}
.switch.on{background:var(--gold)}.switch.on span{transform:translateX(20px);background:#fff7ea}
.music-fail{position:relative;z-index:5;text-align:right;margin:6px 20px 0;font-size:13px;color:var(--pink)}
.music-fail a{color:var(--gold-2)}

/* stage */
.stage{position:relative;z-index:2;display:grid;grid-template-columns:minmax(180px,230px) minmax(0,1fr);gap:40px;padding:30px 60px 30px 22px}
.side{display:flex;flex-direction:column;gap:0;transform:translate(calc(var(--px)*8px),calc(var(--py)*6px))}
.polaroid{background:linear-gradient(170deg,#f5e9d6,#e7d4b6);padding:9px 9px 0;box-shadow:0 14px 28px rgba(0,0,0,.45),0 2px 4px rgba(0,0,0,.3);position:relative}
.polaroid img{display:block;width:100%;height:auto}
.hero-pol{transform:rotate(-8deg);margin:40px 0 0;padding-bottom:0}
.hero-pol figcaption{color:#5a3a1e;font-family:var(--serif);font-style:italic;font-size:17px;padding:8px 4px 14px;display:flex;align-items:center;justify-content:center;gap:6px}
.hero-pol figcaption svg,.mini-heart svg{color:#9b6a2a}
.tape{position:absolute;top:-12px;left:30%;width:70px;height:22px;background:rgba(205,170,140,.7);transform:rotate(-5deg);box-shadow:0 1px 2px rgba(0,0,0,.2);z-index:1}
.strip{width:62%;transform:rotate(-4deg);margin:10px 0 0 8px;display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
.strip img{aspect-ratio:4/5;object-fit:cover;object-position:center 25%}
.mini-heart{display:flex;justify-content:center;padding:4px 0 6px}

.main{min-width:0}
.main.enter{animation:rise .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.chapter{display:flex;flex-direction:column;align-items:center;gap:22px}
.ch-head{text-align:center}
.ornament{color:var(--gold);display:block}
.kicker{margin:10px 0 4px;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-2)}
.ch-head h1,.main h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(28px,4vw,42px);line-height:1.15;text-wrap:balance}
.ch-head h1 i{color:var(--pink)}
.lede{margin:0;text-align:center;max-width:520px;color:#ead6c4;font-size:16px;font-weight:300}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* memory */
.memory{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px 40px;width:100%;max-width:720px;perspective:1200px}
.card{aspect-ratio:100/126;border:0;padding:0;background:none;cursor:pointer;transform:rotate(var(--tilt))}
.card-in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.card.open .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 12px 22px rgba(0,0,0,.45)}
.back{background:radial-gradient(circle at 40% 30%,#e3b8ac,#d19d90);border:7px solid #ead6c4;display:grid;place-items:center}
.seal{width:52%;aspect-ratio:1;border:1.5px solid #a8743c;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-style:italic;color:#9b6730;font-size:clamp(16px,2vw,24px)}
.front{transform:rotateY(180deg);background:linear-gradient(170deg,#f5e9d6,#e7d4b6);padding:8px 8px 0;display:flex;flex-direction:column}
.front img{width:100%;height:auto;aspect-ratio:3/4;object-fit:cover;object-position:top;flex:1;min-height:0}
.card:hover .card-in{transform:translateY(-4px)}
.card.open:hover .card-in{transform:rotateY(180deg)}

/* footer */
.footer{display:grid;grid-template-columns:auto auto minmax(0,320px) auto;align-items:center;gap:26px;margin-top:20px;width:100%;justify-content:center}
.status{margin:0;font-family:var(--serif);font-size:22px}
.status i{color:var(--gold-2);font-size:20px}
.divider{width:1px;height:40px;background:rgba(210,164,98,.6)}
.hint{display:flex;align-items:center;gap:14px;text-align:left;border:0;cursor:pointer;padding:12px 20px;color:var(--ink);background:#e5b9ae;clip-path:polygon(0 6%,4% 0,30% 4%,60% 0,96% 3%,100% 10%,99% 50%,100% 92%,94% 100%,60% 96%,30% 100%,3% 96%,0 88%,1% 50%);box-shadow:0 8px 18px rgba(0,0,0,.3)}
.hint b{display:block;font-weight:500;font-size:13px}
.hint em{font-family:var(--serif);font-size:15px}
.hint-heart{color:#9b6730}
.foot-btns{display:flex;gap:14px}
.ghost{display:inline-flex;align-items:center;gap:10px;padding:10px 26px;border:1px solid var(--gold);border-radius:6px;background:rgba(30,4,9,.3);color:var(--cream);font-family:var(--serif);font-size:16px;cursor:pointer}
.ghost svg{color:var(--gold)}
.ghost:hover{background:rgba(210,164,98,.15)}
.ghost.small{font-size:14px;padding:8px 18px}
.gold-btn{padding:12px 30px;border:0;border-radius:99px;cursor:pointer;background:linear-gradient(180deg,var(--gold-2),#b5823f);color:var(--ink);font-family:var(--serif);font-size:17px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.gold-btn:disabled{opacity:.6}
.gold-btn.next{display:block;margin:34px auto 0}

/* dials */
.dials{display:flex;gap:30px;flex-wrap:wrap;justify-content:center}
.dial{display:grid;justify-items:center;gap:6px;width:170px;padding:18px 10px;background:linear-gradient(170deg,#f5e9d6,#e2cba8);color:var(--ink);box-shadow:0 14px 26px rgba(0,0,0,.4);transform:rotate(-1.5deg)}
.dial:nth-child(2){transform:rotate(1.5deg)}
.dial button{border:1px solid #b5823f;background:transparent;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;color:#8a5a22;cursor:pointer}
.dial output{font-family:var(--serif);font-size:34px;min-height:48px}
.dial-label{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:#8a5a22}

/* arrange */
.answer,.pool{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;width:100%;max-width:680px}
.answer{min-height:76px;padding:16px;background:linear-gradient(170deg,#f5e9d6,#e7d4b6);color:var(--ink);box-shadow:0 14px 26px rgba(0,0,0,.4);align-items:center}
.placeholder{font-family:var(--serif);font-style:italic;color:#8a6a4a}
.tile{border:1px solid var(--gold);background:rgba(40,6,12,.6);color:var(--cream);padding:10px 18px;border-radius:4px;font-family:var(--serif);font-size:19px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.3);transition:transform .2s}
.tile:hover{transform:translateY(-2px)}
.tile.on{background:#e5b9ae;color:var(--ink);border-color:#b5823f}
.letters .tile{width:52px;padding:10px 0;font-size:24px}

/* pads */
.pads{display:grid;grid-template-columns:repeat(2,minmax(0,190px));gap:20px}
.pad{display:grid;justify-items:center;gap:8px;padding:24px 12px;border:1px solid rgba(210,164,98,.5);background:rgba(40,6,12,.5);color:var(--cream);cursor:pointer;font-family:var(--serif);font-size:16px;transition:all .2s;border-radius:8px}
.pad svg{width:34px;height:34px;color:var(--gold)}
.pad.lit{background:#e5b9ae;color:var(--ink);transform:scale(1.06);box-shadow:0 0 36px rgba(242,184,198,.6)}
.pad.lit svg{color:#a3324f}

/* rewards */
.phone{width:min(300px,80vw);aspect-ratio:9/18;border:2px solid var(--gold);border-radius:36px;padding:12px;background:#120306;box-shadow:0 30px 60px rgba(0,0,0,.6);display:grid;place-items:center;overflow:hidden}
.phone video{width:100%;height:100%;border-radius:26px;background:#000;object-fit:contain}
.media-fail{text-align:center;padding:20px;color:var(--cream)}
.media-fail a{color:var(--gold-2)}
.voice-card{width:min(520px,100%);padding:18px 22px;border:1px solid var(--gold);border-radius:99px;background:rgba(30,4,9,.6)}
.voice-card audio{width:100%;display:block}
.masonry{columns:4 200px;column-gap:22px;width:100%}
.g-item{display:block;width:100%;break-inside:avoid;margin:0 0 24px;border:0;cursor:zoom-in;transform:rotate(var(--tilt));transition:transform .3s;text-align:left}
.g-item:hover{transform:rotate(0) scale(1.03);z-index:2}
.cap{display:block;padding:8px 4px 12px;color:#5a3a1e;font-family:var(--serif);font-style:italic;font-size:14px}
.rot{position:relative;display:block;width:100%;overflow:hidden;container-type:size}
.rot img{position:absolute;top:50%;left:50%;width:100cqh!important;height:100cqw!important;max-width:none;transform:translate(-50%,-50%) rotate(-90deg)}
.wide{width:100%}
.lightbox{position:fixed;inset:0;z-index:50;background:rgba(20,3,7,.92);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:20px;touch-action:pan-y}
.lb-fig{margin:0 auto;padding:10px 10px 0;animation:rise .35s ease both;width:fit-content;max-width:100%}
.lb-fig>img,.lb-fig .rot{max-height:76vh;width:auto;max-width:100%}
.lb-fig .rot{height:76vh;width:auto;max-width:80vw}
.lb-fig figcaption{color:#5a3a1e;font-family:var(--serif);font-style:italic;font-size:18px;padding:10px 4px 14px;display:flex;justify-content:space-between;gap:20px}
.lb-fig small{font-family:Jost,sans-serif;font-style:normal;font-size:13px}
.lb-nav,.lb-close{border:1px solid var(--gold);background:rgba(40,6,12,.7);color:var(--cream);width:48px;height:48px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.lb-close{position:absolute;top:16px;right:16px;z-index:2}
.chat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;width:100%;max-width:640px}
.bubble{align-self:flex-start;max-width:85%;padding:14px 18px;background:linear-gradient(170deg,#f5e9d6,#e7d4b6);color:var(--ink);border-radius:18px 18px 18px 4px;box-shadow:0 8px 18px rgba(0,0,0,.35);animation:rise .5s ease both;font-size:16px}
.bubble.alt{align-self:flex-end;background:#e5b9ae;border-radius:18px 18px 4px 18px}
.bubble small{display:block;margin-top:4px;font-family:var(--serif);font-style:italic;color:#8a5a22}
.envelope{position:relative;width:240px;height:160px;border:0;cursor:pointer;background:linear-gradient(180deg,#d77a95,#b94d6c);box-shadow:0 20px 40px rgba(0,0,0,.5);overflow:hidden;transition:transform .3s}
.envelope:hover{transform:translateY(-4px) rotate(-1deg)}
.env-flap{position:absolute;inset:0 0 40% 0;background:#a43e5d;clip-path:polygon(0 0,100% 0,50% 100%)}
.env-seal{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d79c,#c99a55);display:grid;place-items:center;color:#7a4a1a;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.env-name{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-family:var(--serif);font-style:italic;color:#fff3ea;font-size:20px}
.letter{width:min(640px,100%);padding:clamp(24px,5vw,48px);background:linear-gradient(175deg,#f8eedd,#ecdcc0);color:var(--ink);box-shadow:0 24px 50px rgba(0,0,0,.5);font-family:var(--serif);font-size:17px;line-height:1.75;animation:unfold .8s ease both;transform-origin:top}
.letter p{margin:0 0 14px;animation:rise .7s ease both}
.letter .sign,.closing .sign{text-align:right;font-style:italic;font-size:20px}
@keyframes unfold{from{transform:perspective(800px) rotateX(-70deg);opacity:0}}

/* finale */
.cake{display:grid;justify-items:center;margin-top:40px}
.candles{display:flex;gap:22px;margin-bottom:-2px}
.candle{position:relative;width:14px;height:60px;border:0;padding:0;cursor:pointer;background:repeating-linear-gradient(135deg,#f5e6d3 0 6px,#e5b9ae 6px 12px);border-radius:3px}
.flame{position:absolute;left:50%;bottom:100%;width:14px;height:24px;margin-left:-7px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff6d5,#f3b44c 60%,transparent 70%);animation:flicker .25s ease-in-out infinite alternate;box-shadow:0 0 22px 6px rgba(243,180,76,.4)}
.candle.out .flame{opacity:0;transform:translateY(-10px) scale(.4);transition:all .4s;animation:none}
@keyframes flicker{to{transform:scale(1.06,.94) rotate(2deg)}}
.cake-body{width:260px;max-width:100%;height:110px;background:linear-gradient(180deg,#f2d4cb 0 22%,#d4889c 22% 60%,#f3e6d2 60% 70%,#c06985 70%);border-radius:10px 10px 4px 4px;display:grid;place-items:center;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.cake-body span{font-family:var(--serif);font-style:italic;color:#fff3ea;font-size:26px;margin-top:10px}
.closing{max-width:560px;text-align:center;font-family:var(--serif);font-size:19px;line-height:1.7;animation:rise .8s ease both}
.closing p{margin:0 0 12px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti span{position:absolute;top:-20px;width:8px;height:14px;border-radius:2px;animation:fall 3.6s ease-in forwards}
@keyframes fall{to{top:105vh;transform:rotate(720deg) translateX(60px);opacity:.7}}
.made{position:relative;z-index:2;text-align:center;padding:30px 0 26px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:rgba(243,230,210,.55)}

/* confirm sheet (replaces window.confirm, which the viewer blocks) */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(20,3,7,.8);display:grid;place-items:center;padding:20px}
.sheet[hidden]{display:none}
.sheet-box{max-width:380px;background:linear-gradient(170deg,#f5e9d6,#e7d4b6);color:var(--ink);padding:26px;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.6);display:grid;gap:18px;font-family:var(--serif);font-size:18px}
.sheet-box p{margin:0}
.sheet-box .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.sheet-box .ghost{color:var(--ink);border-color:#b5823f;background:transparent}

@media (max-width:1100px){
  .topbar{margin-left:16px;grid-template-columns:minmax(0,1fr) auto}
  .dates{grid-row:2;grid-column:1/-1;border-left:0;padding:6px 0;display:flex;gap:18px;flex-wrap:wrap}
  .lamp{display:none}
  .stage{grid-template-columns:minmax(140px,180px) minmax(0,1fr);padding:24px;gap:24px}
  .memory{gap:20px}
  .footer{grid-template-columns:1fr;justify-items:center;gap:14px}
  .divider{display:none}
}
@media (max-width:720px){
  .topbar{margin:10px 16px 0;gap:10px}
  .tab{padding:0 14px;font-size:15px;height:42px}
  .count{padding:0 14px 0 10px;font-size:12px}
  .dates{font-size:12px}
  .stage{grid-template-columns:1fr;padding:16px}
  .side{flex-direction:row;justify-content:center;align-items:flex-start;gap:14px;transform:none}
  .hero-pol{width:36%;margin-top:8px;transform:rotate(-4deg)}
  .hero-pol figcaption{font-size:13px;padding:6px 2px 10px}
  .dials{gap:14px}
  .dial{width:130px;padding:12px 8px}
  .dial output{font-size:24px;min-height:36px}
  .strip{width:22%;flex-direction:column;margin:0}
  .flowers,.spark{display:none}
  .memory{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .masonry{columns:2;column-gap:12px}
  .lightbox{grid-template-columns:1fr 1fr;padding:60px 10px 20px}
  .lb-fig{grid-column:1/-1;grid-row:1}
  .lb-fig .rot{height:auto;width:90vw}
  .lb-nav{grid-row:2;justify-self:center}
  .status{font-size:18px;text-align:center}
  .foot-btns .ghost{padding:10px 18px}
  .pads{grid-template-columns:repeat(2,minmax(0,1fr))}
  .music{padding-left:10px;gap:8px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .confetti{display:none}
}

/* ===== v2: love upgrade ===== */

    if (open_("cups")) return '<section class="chapter reward">' + heading("found it", "mera dil <i>hamesha</i> tumhe mil jaata hai") + '<div class="stamp">' + cp.need + ' / ' + cp.need + ' ♥</div><p class="lede">Kitna bhi chhupa lo, tum har baar mera dil dhoondh leti ho. Kyunki woh tumhare paas hi rehta hai.</p>' + replayBtn("Phir se khelo") + "</section>";
    var cups = [0, 1, 2].map(function (c) { return '<button type="button" class="cup' + (cp.pick === c ? " pick" : "") + '" data-act="cup" data-i="' + c + '" style="left:' + (cp.pos[c] * 35) + '%" aria-label="Cup"><span class="shell"></span>' + (c === 0 ? '<span class="hh">♥</span>' : "") + "</button>"; }).join("");
    return '<section class="chapter">' + heading("chapter eleven · find my heart", "dil <i>kahan</i> chhupa hai?") + '<p class="lede">Ek cup ke neeche Omm ka dil hai. Shuffle ke baad sahi cup chuno — 3 baar jeeto.</p><div class="qdots">' + [0, 1, 2].map(function (i) { return '<i class="' + (i < cp.wins ? "on" : "") + '"></i>'; }).join("") + '</div><div class="cups' + (cp.phase === "idle" || cp.phase === "shown" ? " reveal" : "") + '" id="cups">' + cups + '</div><button type="button" class="gold-btn" data-act="cshuf" ' + (cp.phase === "shuffling" || cp.phase === "pick" ? "disabled" : "") + ">Shuffle</button>" + foot2('<span id="cnote">' + cp.note + "</span>", "") + "</section>";
  }
  function cupsShuffle() {
    cp.phase = "shuffling"; cp.pick = -1; cp.note = "dhyan se…"; render();
    var n = 6 + cp.wins * 3, sp = Math.max(240, 420 - cp.wins * 70), k = 0;
    var t = setInterval(function () {
      var a = Math.floor(Math.random() * 3), b = (a + 1 + Math.floor(Math.random() * 2)) % 3, tmp = cp.pos[a]; cp.pos[a] = cp.pos[b]; cp.pos[b] = tmp;
      document.querySelectorAll("#cups .cup").forEach(function (el, c) { el.style.transitionDuration = sp + "ms"; el.style.left = cp.pos[c] * 35 + "%"; });
      if (++k >= n) { clearInterval(t); setTimeout(function () { cp.phase = "pick"; cp.note = "Ab chuno ♡"; render(); }, sp); }
    }, sp + 40);
  }
  function cupPick(c) {
    if (cp.phase !== "pick") return;
    cp.pick = c; cp.phase = "shown";
    if (c === 0) { cp.wins++; cp.note = cp.wins >= cp.need ? "Teeno baar! ♡" : "Mil gaya! Ab thoda tez…"; render(); if (cp.wins >= cp.need) setTimeout(function () { solve("cups"); burst(); }, 900); }
    else { cp.note = "Oops, yeh khaali tha — dil wahan tha. Phir se shuffle!"; render(); }
  }
  /* petals */
  (function () {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var a = document.createElement("div"); a.className = "amb"; a.setAttribute("aria-hidden", "true"); var h = "";
    for (var i = 0; i < 18; i++) h += '<span class="petal" style="left:' + ((i * 61) % 100) + "%;animation-duration:" + (12 + (i * 7) % 10) + "s;animation-delay:-" + ((i * 5) % 18) + "s;transform:scale(" + (0.6 + (i % 4) * 0.2) + ')"></span>';
    a.innerHTML = h; $("#desk").insertBefore(a, $("#desk").children[1]);
  })();
  /* intro */
  (function () {
    var it = document.createElement("div"); it.className = "intro"; it.setAttribute("role", "button"); it.setAttribute("aria-label", "Open");
    it.innerHTML = '<div><div class="big">♥</div><h2>Priji, yeh sirf tumhare liye</h2><p id="tw"></p><small>tap anywhere to open</small></div>';
    document.body.appendChild(it);
    var lines = ["har puzzle mein thoda sa pyaar chhupa hai…", "har tasveer mein tum ho…", "aur har dhadkan mein bhi ♡"], li = 0, ci = 0, tw = $("#tw");
    var tt = setInterval(function () { var L = lines[li]; tw.textContent = L.slice(0, ++ci); if (ci > L.length + 18) { ci = 0; li = (li + 1) % lines.length; } }, 70);
    it.addEventListener("click", function () { clearInterval(tt); it.classList.add("gone"); burst(); setTimeout(function () { it.remove(); }, 1100); });
  })();

  /* ---------- render ---------- */
  function render() {
    var v = st.view, h = "";
    if (v === "edit") h = editHTML();
    else if (v === "gallery") h = galleryHTML();
    else if (v === "msgs") h = msgsHTML();
    else if (v === "letter") h = letterHTML();
    else if (v === "voice") h = voiceHTML();
    else if (v === "quiz") h = quizHTML();
    else if (v === "hearts") h = heartsHTML();
    else if (v === "slide") h = slideHTML();
    else if (v === "scratch") h = scratchHTML();
    else if (v === "balloons") h = balloonsHTML();
    else if (v === "cups") h = cupsHTML();
    else h = finaleHTML();
    main.innerHTML = h + nextLink();
    stopHearts(); if (v === "hearts" && !open_("hearts")) startHearts(); if (v === "slide" && !open_("slide")) paintSlide(); if (v === "scratch" && !open_("scratch")) { sc.done = false; startScratch(); }
    var vid = main.querySelector("video"); if (vid) vid.addEventListener("error", function () { st.edit.failed = true; $("#phone").innerHTML = mediaFail("Video"); });
    var au = main.querySelector(".voice-card audio"); if (au) au.addEventListener("error", function () { st.voice.failed = true; $("#vcard").innerHTML = mediaFail("Voice note"); });
  }
  function setView(v) {
    st.view = v; st.shown = 0; render(); renderTabs();
    main.classList.remove("enter"); void main.offsetWidth; main.classList.add("enter");
  }
  function renderTabs() {
    var cnt = CHAPTERS.filter(function (c, i) { return unlocked(i); }).length;
    var t = CHAPTERS.map(function (c, i) {
      var ok = unlocked(i), done = isSolved(c.id);
      return '<button type="button" class="tab ' + (st.view === c.id ? "active" : "") + " " + (done ? "done" : "") + '" ' + (ok ? "" : "disabled") + ' ' + (st.view === c.id ? 'aria-current="page"' : "") + ' data-act="go" data-v="' + c.id + '">' + c.label + " " + (done ? Ic.check : !ok ? '<span class="lk" aria-label="locked">' + Ic.lock + "</span>" : "") + "</button>";
    }).join("");
    if (allDone()) t += '<button type="button" class="tab ' + (st.view === "finale" ? "active" : "") + '" data-act="go" data-v="finale">Finale ' + Ic.cake + "</button>";
    t += '<span class="count" aria-live="polite">' + (allDone() ? CHAPTERS.length + " of " + CHAPTERS.length + " ♡" : cnt + " of " + CHAPTERS.length + " open") + "</span>";
    $("#tabs").innerHTML = t;
  }
  function renderDates() {
    var b = st.bday;
    $("#dates").innerHTML = "<p>" + (b ? (b.today ? "<b>Happy Birthday, Priji! Aaj 8 November hai</b>" : "Priji's birthday in <b>" + b.days + "</b> " + (b.days === 1 ? "day" : "days") + ' <span class="dot">·</span> 8 November') : 'Priji\'s birthday <span class="dot">·</span> 8 November') + '</p><p>30 May <span class="dot">·</span> <i>where it all began</i></p>';
  }

  /* ---------- confetti ---------- */
  function burst() {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var box = document.createElement("div"); box.className = "confetti"; box.setAttribute("aria-hidden", "true");
    var cols = ["#e7b86a", "#f2b8c6", "#fff3e0", "#c9577a"], s = "";
    for (var i = 0; i < 70; i++) s += '<span style="left:' + ((i * 37) % 100) + '%;animation-delay:' + ((i % 14) * 0.12) + 's;background:' + cols[i % 4] + ';transform:rotate(' + (i * 29) + 'deg)"></span>';
    for (var j = 0; j < 14; j++) s += '<span class="hf" style="left:' + (j * 7 + 3) + '%;animation-delay:' + (j * 0.18) + 's">♥</span>';
    box.innerHTML = s; $("#fx").appendChild(box); setTimeout(function () { box.remove(); }, 6000);
  }

  /* ---------- lightbox ---------- */
  var startX = null;
  function lbOpen(i) {
    st.gal.box = i; var n = GALLERY.length, p = GALLERY[i];
    $("#lb").innerHTML = '<div class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer"><button type="button" class="lb-close" data-act="lbx" aria-label="Close">' + Ic.close + '</button><button type="button" class="lb-nav prev" data-act="lbgo" data-d="-1" aria-label="Previous photo">' + Ic.left + '</button><figure class="lb-fig polaroid">' + pic(p, "lb-pic") + '<figcaption>' + p.caption + '<small>' + (i + 1) + " / " + n + '</small></figcaption></figure><button type="button" class="lb-nav next" data-act="lbgo" data-d="1" aria-label="Next photo">' + Ic.right + '</button></div>';
    var box = $("#lb .lightbox");
    box.addEventListener("pointerdown", function (e) { startX = e.clientX; });
    box.addEventListener("pointerup", function (e) { if (startX !== null && Math.abs(e.clientX - startX) > 50) lbGo(e.clientX < startX ? 1 : -1); startX = null; });
  }
  function lbGo(d) { var n = GALLERY.length; lbOpen((st.gal.box + d + n) % n); }
  function lbClose() { st.gal.box = null; $("#lb").innerHTML = ""; }
  addEventListener("keydown", function (e) {
    if (st.gal.box === null) return;
    if (e.key === "ArrowRight") lbGo(1); if (e.key === "ArrowLeft") lbGo(-1); if (e.key === "Escape") lbClose();
  });

  /* ---------- actions ---------- */
  function retry() {
    st.shown = 0; var v = st.view;
    if (v === "edit") { st.edit.day = 14; st.edit.month = 1; st.edit.msg = "dono dials ghumao"; }
    else if (v === "gallery") galleryDeckInit();
    else if (v === "msgs" || v === "letter") initArrange(st.arr.target, st.arr.key);
    else if (v === "voice") { st.voice.step = 0; st.voice.note = "phir se, aaram se"; }
    else if (v === "quiz") { qz.q = 0; qz.ok = qz.bad = -1; qz.note = ""; qz.lock = false; }
    else if (v === "hearts") hg.n = 0;
    else if (v === "slide") slInit();
    else if (v === "balloons") blReset();
    else if (v === "cups") { cp.wins = 0; cp.phase = "idle"; cp.pick = -1; cp.pos = [0, 1, 2]; }
    render();
  }
  function askReset() { $("#sheet").hidden = false; $("#yes").focus(); }
  $("#no").addEventListener("click", function () { $("#sheet").hidden = true; });
  $("#yes").addEventListener("click", function () {
    $("#sheet").hidden = true; saveSolved([]); st.solved = []; st.replay = {}; st.blown = [false, false, false, false, false];
    st.msgs.round = 0; st.letter.opened = false; st.arr.key = ""; galleryDeckInit(); st.voice.step = 0; st.voice.note = "'Show me' dabao, phir wahi order tap karo"; qz.q = 0; qz.ok = qz.bad = -1; qz.note = ""; qz.lock = false; hg.n = 0; slInit(); blReset(); cp.wins = 0; cp.phase = "idle"; cp.pick = -1;
    renderTabs(); setView("edit");
  });

  main.addEventListener("click", function (e) { act(e.target.closest("[data-act]")); });
  $("#tabs").addEventListener("click", function (e) { act(e.target.closest("[data-act]")); });
  $("#lb").addEventListener("click", function (e) { act(e.target.closest("[data-act]")); });
  function act(b) {
    if (!b || b.disabled) return;
    var a = b.dataset.act, v = st.view;
    if (a === "go") setView(b.dataset.v);
    else if (a === "hint") { st.shown = Math.min(+b.dataset.n, st.shown + 1); render(); }
    else if (a === "retry") retry();
    else if (a === "reset") askReset();
    else if (a === "replay") {
      st.replay[v] = true; st.shown = 0;
      if (v === "gallery") galleryDeckInit();
      if (v === "msgs") { st.msgs.round = 0; st.arr.key = ""; }
      if (v === "letter") { st.letter.opened = false; st.arr.key = ""; }
      if (v === "voice") st.voice.step = 0;
      if (v === "quiz") { qz.q = 0; qz.ok = qz.bad = -1; qz.note = ""; qz.lock = false; }
      if (v === "hearts") hg.n = 0;
      if (v === "slide") slInit();
      if (v === "balloons") blReset();
      if (v === "cups") { cp.wins = 0; cp.phase = "idle"; cp.pick = -1; }
      if (v === "edit") { st.edit.msg = "dono dials ghumao, phir 'Open' dabao"; }
      renderTabs(); render();
    }
    else if (a === "dial") {
      var d = +b.dataset.d;
      if (b.dataset.k === "day") st.edit.day = d > 0 ? (st.edit.day % 31) + 1 : ((st.edit.day + 29) % 31) + 1;
      else st.edit.month = d > 0 ? (st.edit.month + 1) % 12 : (st.edit.month + 11) % 12;
      render();
    }
    else if (a === "open-edit") {
      if (st.edit.day === 30 && st.edit.month === 4) { st.edit.msg = "Haan! Wahi din ♡"; solve("edit"); burst(); }
      else { st.edit.msg = "Uff, close… phir se try karo, jaan"; render(); }
    }
    else if (a === "qz") quizPick(+b.dataset.i);
    else if (a === "sl") slTap(+b.dataset.k);
    else if (a === "bln") blTap(+b.dataset.i, b);
    else if (a === "cshuf") cupsShuffle();
    else if (a === "cup") cupPick(+b.dataset.i);
    else if (a === "peek") { var bd = $("#sboard"); if (bd) { bd.classList.add("peek"); setTimeout(function () { bd.classList.remove("peek"); }, 1600); } }
    else if (a === "reason") b.classList.toggle("on");
    else if (a === "flip") flip(+b.dataset.i);
    else if (a === "lb") lbOpen(+b.dataset.i);
    else if (a === "lbx") lbClose();
    else if (a === "lbgo") lbGo(+b.dataset.d);
    else if (a === "pick") arrangePick(+b.dataset.i, function () {
      if (v === "msgs") { if (st.msgs.round + 1 < FLIRTS.length) { st.msgs.round++; st.shown = 0; render(); } else { solve("msgs"); burst(); } }
      else { solve("letter"); burst(); }
    });
    else if (a === "unpick") arrangeUnpick(+b.dataset.i);
    else if (a === "env") { st.letter.opened = true; render(); }
    else if (a === "show") voiceShow();
    else if (a === "pad") voiceTap(+b.dataset.i);
    else if (a === "candle") { st.blown[+b.dataset.i] = true; render(); if (st.blown.every(Boolean)) burst(); }
    else if (a === "relight") { st.blown = [false, false, false, false, false]; render(); }
  }

  /* ---------- music ---------- */
  var bgm = $("#bgm"), sw = $("#sw"), playing = false;
  sw.addEventListener("click", function () {
    if (playing) { bgm.pause(); playing = false; sw.classList.remove("on"); sw.setAttribute("aria-checked", "false"); return; }
    var pr = bgm.play();
    if (pr && pr.then) pr.then(function () { playing = true; sw.classList.add("on"); sw.setAttribute("aria-checked", "true"); $("#mfail").hidden = true; }).catch(function () { $("#mfail").hidden = false; });
  });
  bgm.addEventListener("error", function () { if (playing) { playing = false; sw.classList.remove("on"); sw.setAttribute("aria-checked", "false"); } $("#mfail").hidden = false; });

  /* ---------- parallax ---------- */
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    var desk = $("#desk");
    addEventListener("pointermove", function (e) {
      desk.style.setProperty("--px", ((e.clientX / innerWidth) * 2 - 1).toFixed(3));
      desk.style.setProperty("--py", ((e.clientY / innerHeight) * 2 - 1).toFixed(3));
    });
  }

  /* ---------- boot ---------- */
  galleryDeckInit(); slInit();
  var first = CHAPTERS.filter(function (c) { return !isSolved(c.id); })[0];
  st.view = first ? first.id : "finale";
  st.bday = birthdayInfo(new Date()); renderDates();
  setInterval(function () { st.bday = birthdayInfo(new Date()); renderDates(); }, 60000);
  renderTabs(); render();
  if (st.bday.today) burst();
})();
</script>

</body></html>
